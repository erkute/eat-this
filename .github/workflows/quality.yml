name: Quality

on:
  pull_request:
    branches: [main, staging]
  push:
    branches: [staging]

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nextjs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: nextjs
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: nextjs/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # Gleiche Aufteilung wie in apphosting.yaml: der CI-Build zieht auf das
      # API-Kontingent, damit das CDN-Kontingent den Besuchern gehört. CI baut
      # bei jedem Push auf einen PR-Branch — das sind pro Lauf rund 610
      # Sanity-Anfragen, die sonst neben dem echten Traffic lägen.
      - run: npm run build
        env:
          SANITY_USE_CDN: 'false'
