name: Quality

on:
  pull_request:
    branches: [main, staging]
  push:
    branches: [staging]

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nextjs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: nextjs
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: nextjs/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # Am Sanity-API-CDN vorbei: dessen Kontingent war am 24.08.2026
      # aufgebraucht und der Build brach beim Sammeln der Seitendaten mit
      # 402 plan_limit_reached ab. Die normale API zieht auf ein eigenes
      # Kontingent. Gleiche Einstellung wie in apphosting.yaml.
      - run: npm run build
        env:
          SANITY_USE_CDN: 'false'
