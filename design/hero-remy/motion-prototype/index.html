<!doctype html>
<html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Remy · Bewegungsstudie</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#171717;color:#fff;font-family:system-ui,sans-serif}.stage{position:relative;height:calc(100dvh - 108px);overflow:hidden;background:#f6f2e9 url(home-desktop.png) top center/cover no-repeat}.cover{position:absolute;inset:0;background:#000;transform:translateX(var(--edge,0px));box-shadow:-8px 0 20px #0002}.edge{position:absolute;left:0;top:0;bottom:0;width:2px;background:#ffffff18}canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.controls{height:108px;padding:13px 22px;background:#171717;display:grid;gap:9px}.row{display:flex;align-items:center;gap:12px}button{border:0;border-radius:5px;padding:8px 14px;background:#f4dc45;color:#171717;font:600 13px system-ui;cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid white;outline-offset:3px}label,.note{font-size:12px;color:#ccc}.phase{font-size:13px;margin-left:auto}input[type=range]{width:100%;accent-color:#f4dc45}.note{margin-left:auto} @media(max-width:600px){.stage{background-image:url(home-mobile.png)}.controls{padding:12px}.note{display:none}.phase{font-size:11px}button{padding:8px 10px}}
</style>
<main class="stage"><div class="cover"><i class="edge"></i></div><canvas aria-label="Remy schiebt zunächst mit den Händen, dreht sich und schiebt mit dem Rücken weiter."></canvas></main>
<div class="controls"><div class="row"><button id="play">Noch einmal</button><label><input id="slow" type="checkbox"> Zeitlupe</label><span class="phase" aria-live="polite">Bilder laden …</span><span class="note">Flüssige Übergänge · Mimik · Abschluss</span></div><input id="seek" type="range" min="0" max="8.4" step="0.01" value="0" aria-label="Zeitpunkt der Animation"></div>
<script src="animation.js"></script></html>
