name: Quality

on:
  pull_request:
    branches: [main, staging]
  # `main` ist hier nicht als Gate drin — der Code hat den Gang über den PR
  # schon hinter sich. Es geht um den Fetch-Cache weiter unten: Actions lässt
  # einen Lauf nur die Caches seines EIGENEN Refs, seines Basis-Branches und
  # des Default-Branches lesen. Ohne einen Lauf auf `main` gibt es dort keinen
  # Cache, und jeder `staging → main`-PR baut kalt — am 29.08.2026 genau so
  # beobachtet („Cache not found for input keys: sanity-fetch-cache-…").
  # Ein Cache auf dem Default-Branch ist dagegen von jedem Branch aus lesbar
  # und schließt die Lücke für alle Lauf-Arten auf einmal.
  push:
    branches: [main, staging]

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nextjs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: nextjs
    steps:
      - uses: actions/checkout@v5

      # Reine Doku-Änderungen brauchen keinen Build: ändert der PR bzw. Push nur
      # Markdown oder Agent-Konfiguration, meldet der Check nach Sekunden grün
      # statt nach ~4 Minuten. `nextjs` bleibt dabei ein erfolgreicher Lauf, der
      # Pflicht-Check auf `main` wird also erfüllt (ein `paths-ignore` am
      # Trigger würde ihn dagegen ewig „ausstehend“ lassen). Im Zweifel – neuer
      # Branch ohne Vorgänger, Vergleich schlägt fehl, ≥ 300 Dateien – wird gebaut.
      - name: Nur Doku geändert?
        id: scope
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          code=true
          if [ -n "$BASE" ] && [ "$BASE" != 0000000000000000000000000000000000000000 ] \
            && files=$(gh api "repos/$GITHUB_REPOSITORY/compare/$BASE...$HEAD" --jq '.files[].filename') \
            && [ -n "$files" ] && [ "$(wc -l <<< "$files")" -lt 300 ] \
            && ! grep -qvE '\.md$|^\.claude/' <<< "$files"; then
            code=false
            echo "Nur Doku geändert – Build übersprungen:"; printf '  %s\n' $files
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v5
        if: steps.scope.outputs.code == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: nextjs/package-lock.json
      - run: npm ci
        if: steps.scope.outputs.code == 'true'
      - run: npm run lint
        if: steps.scope.outputs.code == 'true'
      - run: npm test
        if: steps.scope.outputs.code == 'true'

      # Remys Vektor-Indizes (Spots und Artikel) sind eingecheckte Moment-
      # aufnahmen, die nichts automatisch nachziehen. Am 06.09.2026 kannte der
      # Spot-Index 340 von 465 Spots — drei Monate lang, ohne dass etwas rot
      # wurde: die fehlenden werden nicht gefiltert, sie ranken nur ans Ende
      # und tauchen in Remys Antworten nicht mehr auf. Beim Artikel-Index
      # waere es schlimmer, dort entscheidet das Ranking die Treffermenge —
      # deshalb steht sein Budget auf 0 %.
      #
      # Kostet ZWEI Sanity-Anfragen, neben den 952 des Builds unten also
      # nichts. Faellt Sanity aus, ueberspringt das Skript den Abgleich und
      # bleibt gruen — dafuer ist der Uptime-Workflow zustaendig, nicht
      # dieser PR.
      - run: npm run check:embeddings
        if: steps.scope.outputs.code == 'true'

      # Der teuerste Schritt dieses Workflows ist nicht CPU, sondern Sanity.
      #
      # Ein kalter `next build` zieht 952 Anfragen aus dem PRODUKTIONS-Dataset
      # (hier ist kein SANITY_PROJECT_ID gesetzt, `lib/sanity.ts` fällt also auf
      # `ehwjnjr2`/`production` zurück) — 1.083 vorgerenderte Seiten aus 466
      # Restaurants, 22 Artikeln, 20 Bezirken, 9 Kategorien und 5 statischen
      # Seiten, plus die Doppelabrufe der parallelen Prerender-Worker. Am
      # 29.08.2026 direkt gemessen, nicht geschätzt.
      #
      # Bei rund 50 grünen Läufen am Tag sind das ~1,5 Mio. Anfragen im Monat.
      # Die Quote liegt bei 250.000 (API) bzw. 1.000.000 (CDN). Genau daran ist
      # am 24.08.2026 das CDN- und am 27.08.2026 das API-Kontingent gerissen:
      # nicht am Besucherverkehr, sondern an diesem Schritt.
      #
      # Next legt jede dieser Antworten in `.next-verify/cache/fetch-cache` ab (24 h
      # Frist, `SANITY_REVALIDATE_SECONDS`). Nimmt man nur dieses Verzeichnis
      # zwischen den Läufen mit, baut CI vollständig durch, ohne Sanity auch
      # nur einmal anzufassen — gemessen: 952 Anfragen kalt, 0 mit
      # restauriertem Cache, bei identischen 1.083 erzeugten Seiten.
      #
      # Der Cache darf hier veralten: dieser Build ist ein CODE-Gate. Der Build,
      # der wirklich ausliefert, läuft bei App Hosting und immer kalt.
      - name: Sanity-Fetch-Cache holen
        if: steps.scope.outputs.code == 'true'
        uses: actions/cache/restore@v4
        with:
          # `path` ist repo-relativ — `defaults.run.working-directory` gilt nur
          # für `run`-Schritte, nicht für Action-Eingaben.
          path: nextjs/.next-verify/cache/fetch-cache
          # Der exakte Key trifft absichtlich nie (`run_id` ist pro Lauf neu),
          # der Treffer kommt über `restore-keys`: der zuletzt gesicherte Stand.
          key: sanity-verify-fetch-cache-${{ github.run_id }}
          restore-keys: |
            sanity-verify-fetch-cache-
            sanity-fetch-cache-

      - run: npm run build:isolated
        if: steps.scope.outputs.code == 'true'

      # Browser, Barrierefreiheit und Lighthouse kosten rund 16 der ~20 Minuten
      # dieses Jobs. Sie laufen nur im PR nach `staging` – dort kommt neuer
      # Code herein. Der Release-PR `staging → main` und die Pushes danach
      # tragen nur schon geprüften Code weiter; sie bauen, linten und testen,
      # brauchen dafür aber ~4 statt ~20 Minuten. Vorher wartete jedes Release
      # zweimal 20 Minuten, und ein Push auf `staging` brach den laufenden
      # Check ab (07.10.2026). Die Live-Messung auf `main` macht lighthouse.yml.
      - name: Browser-Prüfung nötig?
        id: browser
        if: steps.scope.outputs.code == 'true'
        working-directory: .
        run: echo "run=${{ github.event_name == 'pull_request' && github.base_ref == 'staging' }}" >> "$GITHUB_OUTPUT"

      # Sonst rund 25 s. Am 07.10.2026 hing der Schritt 23 Minuten (apt) und
      # hielt das Release fest, ohne rot zu werden.
      - name: Install Chromium and WebKit
        if: steps.browser.outputs.run == 'true'
        timeout-minutes: 5
        run: npx playwright install --with-deps chromium webkit

      - uses: actions/setup-java@v4
        if: steps.browser.outputs.run == 'true'
        with:
          distribution: temurin
          java-version: '21'

      # Public card metadata comes from Sanity; Firestore/Storage use synthetic
      # fixtures in a demo project. PR code receives no production credentials.
      - name: Browser flows, accessibility and Lighthouse (this build)
        if: steps.browser.outputs.run == 'true'
        timeout-minutes: 30
        env:
          FIREBASE_ADMIN_PROJECT_ID: demo-eat-this-quality
        run: |
          export CHROME_PATH="$(node -e "process.stdout.write(require('playwright').chromium.executablePath())")"
          npx --yes firebase-tools@14.22.0 emulators:exec --only firestore,storage --project demo-eat-this-quality --config e2e/firebase.json "npx tsx e2e/seed-firebase.mts && npm run test:e2e && npm run audit:preview"

      - name: Browser and Lighthouse evidence
        if: always() && steps.browser.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-quality-${{ github.run_id }}
          path: |
            /tmp/eat-this-playwright-results
            /tmp/eat-this-lighthouse-preview
            /tmp/eat-this-mobile-*.png
            /tmp/eat-this-desktop-*.png
          retention-days: 7
          if-no-files-found: ignore

      # Nur auf einem Push sichern, also auf `staging` und `main`. Ein Cache aus
      # einem PR-Lauf ist auf genau diesen PR beschränkt und für keinen anderen
      # Branch lesbar — er würde nur den 10-GB-Speicher der Repo-Caches füllen
      # und ältere, nützliche Einträge verdrängen.
      #
      # Die beiden Stände decken zusammen jede Lauf-Art ab: PRs nach `staging`
      # lesen den staging-Stand (ihr Basis-Branch), `staging → main`-PRs und
      # alles andere den main-Stand (Default-Branch, von überall lesbar).
      - name: Sanity-Fetch-Cache sichern
        if: steps.scope.outputs.code == 'true' && github.event_name == 'push'
        uses: actions/cache/save@v4
        with:
          path: nextjs/.next-verify/cache/fetch-cache
          key: sanity-verify-fetch-cache-${{ github.run_id }}
